; Same intent as the .htaccess in this folder — raise PHP's upload limits so
; the online enrollment form's own "up to 5 MB per document" promise is
; actually honored by the server, instead of PHP silently rejecting files
; (or dropping the whole submission) at its 2M/8M stock defaults.
;
; .htaccess "php_value" only works when PHP runs as an Apache module. Many
; shared hosts (this includes most free hosts, likely including
; InfinityFree) instead run PHP via CGI/FastCGI, which reads THIS file
; instead. Keeping both files means whichever mode a given host uses, the
; limit gets applied; the one that doesn't apply is just ignored.
upload_max_filesize = 8M
post_max_size = 40M
max_file_uploads = 20
max_execution_time = 120
