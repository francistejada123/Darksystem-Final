<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d47a1">
    <title>EGradePro - Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef2f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f2937; }
        .box { max-width: 380px; margin: 20px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(13, 71, 161, .12); padding: 28px 22px; text-align: center; }
        img { width: 84px; height: 84px; }
        h1 { font-size: 20px; margin: 14px 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.55; margin: 0 0 18px; }
        button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #1565c0; color: #fff; font-size: 15px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="box">
        <img src="static/images/app/icon-192.png" alt="EGradePro">
        <h1>EGradePro is offline right now</h1>
        <p>The school's EGradePro server cannot be reached at the moment. Check your internet connection, or try again later when the school system is online.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
